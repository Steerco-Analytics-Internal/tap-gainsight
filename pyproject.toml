[tool.poetry]
name = "tap-gainsight"
version = "0.0.1"
description = "`tap-gainsight` is a Singer tap for Gainsight CS, built with the Meltano Singer SDK."
authors = ["Steerco Analytics"]
license = "Apache 2.0"
keywords = ["ELT"]

[tool.poetry.dependencies]
python = "<3.11,>=3.7.1"
requests = "^2.25.1"
singer-sdk = "^0.33.1"
tzdata = ">=2023.3"
"backports.zoneinfo" = { version = "^0.2.1", python = "<3.9" }

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
requests-mock = "^1.11.0"
pytest-cov = "^4.1.0"
pytest-timeout = "^2.2.0"
black = "^21.9b0"
flake8 = "^3.9.2"
isort = "^5.10.1"
mypy = "^0.910"
types-requests = "^2.26.1"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = "tap_gainsight"

[tool.pytest.ini_options]
addopts = "--cov=tap_gainsight --cov-report=term-missing --cov-fail-under=90"
# A hang fails the test after 60 seconds, with a traceback of every thread.
timeout = 60
timeout_method = "thread"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["poetry-core==1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-gainsight = "tap_gainsight.tap:TapGainsight.cli"
